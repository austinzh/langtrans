[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "langtrans"
version = "0.1.0"
description = "A high-level DSL that compiles to LangGraph graphs"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
